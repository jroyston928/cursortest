<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOVA - Client Search</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #374151;
        --border: #e5e7eb;
        --card: #ffffff;
        --card-hover: #f9fafb;
        --link: #1d4ed8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e5e7eb;
          --muted: #cbd5e1;
          --border: #243047;
          --card: #0f172a;
          --card-hover: #111c33;
          --link: #93c5fd;
        }
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 20px;
        background: var(--bg);
        color: var(--fg);
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      form {
        display: flex;
        gap: 10px;
      }

      input {
        flex: 1;
        padding: 10px 12px;
        font-size: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--fg);
      }

      button {
        padding: 10px 14px;
        font-size: 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
      }

      li {
        margin-bottom: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }

      li:hover {
        background: var(--card-hover);
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .name {
        font-weight: 800;
        color: var(--fg);
      }

      .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .debug {
        margin-top: 10px;
        padding: 10px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: color-mix(in srgb, var(--card) 92%, var(--fg) 8%);
        color: var(--fg);
        font-size: 12px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Client Search</h1>
      <form id="f" autocomplete="off">
        <input id="q" placeholder="Search by first name / last name…" />
        <button type="submit">Search</button>
      </form>

      <ul id="results" aria-live="polite"></ul>
    </div>

    <script>
      const f = document.getElementById("f");
      const q = document.getElementById("q");
      const results = document.getElementById("results");

      function clean(v) {
        if (v === null || v === undefined) return "";
        return String(v).trim();
      }

      function pick(obj, keys) {
        for (const k of keys) {
          const v = clean(obj?.[k]);
          if (v) return v;
        }
        return "";
      }

      function render(items) {
        results.innerHTML = "";
        if (!Array.isArray(items) || items.length === 0) {
          results.innerHTML = "<li>No results</li>";
          return;
        }

        for (const c of items) {
          const id = pick(c, ["Client_ID", "ClientID", "client_id", "id"]);
          const fullName = pick(c, ["FullName", "Full_Name", "full_name", "Name", "name"]);
          const firstName = pick(c, ["FirstName", "First_Name", "first_name", "First", "first"]);
          const lastName = pick(c, ["LastName", "Last_Name", "last_name", "Last", "last"]);
          const dob = pick(c, ["DOB", "Dob", "dob", "DateOfBirth", "date_of_birth", "Date_Of_Birth"]);

          const displayName = clean(fullName) || [firstName, lastName].filter(Boolean).join(" ");
          const nameText = clean(displayName) || "(no name)";

          const li = document.createElement("li");
          const href = id ? `/client.html?id=${encodeURIComponent(id)}` : null;

          li.innerHTML = `
            <div class="name">${
              href
                ? `<a href="${href}">${nameText}</a>`
                : `${nameText}`
            }</div>
            <div class="meta">
              Client_ID: ${id || "(missing)"}${dob ? ` • DOB: ${dob.slice(0, 10)}` : ""}
            </div>
          `;

          // If Caspio returned "blank-looking" strings, show safe diagnostics (keys only)
          if (!id && nameText === "(no name)" && !dob) {
            const keys = c && typeof c === "object" ? Object.keys(c) : [];
            const pre = document.createElement("pre");
            pre.className = "debug";
            pre.textContent = `Unexpected empty record. Keys: ${keys.join(", ")}`;
            li.appendChild(pre);
          }

          results.appendChild(li);
        }
      }

      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const query = q.value.trim();
        if (!query) {
          results.innerHTML = "<li>Enter a search term</li>";
          return;
        }

        results.innerHTML = "<li>Searching…</li>";

        try {
          const url = `/api/clients/search?q=${encodeURIComponent(query)}`;
          const resp = await fetch(url);
          const text = await resp.text();

          if (!resp.ok) {
            results.innerHTML = `<li>HTTP ${resp.status}: <pre>${text}</pre></li>`;
            return;
          }

          let data;
          try {
            data = JSON.parse(text);
          } catch {
            results.innerHTML = `<li>Response was not JSON:<pre>${text}</pre></li>`;
            return;
          }

          render(data);
        } catch (err) {
          results.innerHTML = `<li>JS error: ${String(err)}</li>`;
        }
      });
    </script>
  </body>
</html>
